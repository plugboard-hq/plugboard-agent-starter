[project]
name = "plugboard-agent-starter"
version = "0.1.0"
description = "Starter agent for Plugboard."
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["plugboard_starter"]

[tool.ruff]
line-length = 99
target-version = "py312"
